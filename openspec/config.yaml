schema: spec-driven

context: |
  Stack: React 18 (Vite + SWC) + TypeScript strict-loose / Spring Boot 3.5.6 + Java 21 + Maven
  UI: shadcn/ui (Radix primitives), Tailwind 3, Framer Motion, Recharts, next-themes, Sonner
  State: Zustand 5 + TanStack Query 5, forms: React Hook Form + Zod 4
  Backend: Spring Data JPA (Hibernate), Spring Security (JWT jjwt 0.11.5 + OAuth2), Log4j2, SpringDoc OpenAPI
  DB: PostgreSQL 15 (Docker), MinIO for media, optional GCS profile
  API: REST, OpenAPI at /swagger-ui.html, backend :8080, frontend :80 (dev :5173)
  Testing: Backend — JUnit 5 + Spring Boot Test + MockMvc + AssertJ (4 test classes) ; Frontend — none (no test runner installed)

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)
