<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador: Unified Sala View (Tablero 20x20)</title>
  <style>
    /* Estilos base del entorno de simulación */
    body {
      margin: 0;
      padding: 40px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a; /* Fondo oscuro para resaltar el efecto glassmorphism */
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 5px;
      color: #38bdf8;
    }

    p {
      color: #94a3b8;
      margin-bottom: 25px;
      font-size: 0.9rem;
    }

    /* CONTENEDOR PRINCIPAL DE LA SALA (Tablero Fijo) */
    .sala-board-container {
      position: relative;
      width: 100%;
      max-width: 600px; /* Tamaño máximo adaptativo */
      aspect-ratio: 1 / 1; /* Forzar proporción cuadrada (aspect-square) */
      background-color: rgba(30, 41, 59, 0.5); /* Base oscura translúcida */
      border: 2px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* -------------------------------------------------- */
    /* CSS GRADIENT GRID OVERLAY (Capa de Cuadrícula)      */
    /* -------------------------------------------------- */
    .sala-board-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10; /* Por encima del fondo, por debajo de los controles */
      pointer-events: none; /* No interfiere con los clics en las zonas */
      
      /* Renderiza líneas delgadas cada 5% (20 divisiones exactas en ancho y alto) */
      background-image: 
        linear-gradient(to right, rgba(56, 189, 248, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.15) 1px, transparent 1px);
      
      /* Cada celda representa exactamente el 5% del contenedor */
      background-size: 5% 5%; 
    }

    /* -------------------------------------------------- */
    /* COMPONENTE: ZONABLOCK (Zonas con Glassmorphism)    */
    /* -------------------------------------------------- */
    .zona-block {
      position: absolute;
      box-sizing: border-box;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
      min-width: 50px; /* Restricción de usabilidad UX para pantallas chicas */
      min-height: 50px;

      /* Efecto Glassmorphism */
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* z-index hover implementado en el plan de diseño */
    .zona-block:hover {
      z-index: 50; 
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
      transform: scale(1.02);
    }

    /* Etiquetas internas de información */
    .zona-titulo {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #f1f5f9;
    }

    .zona-dims {
      font-size: 0.65rem;
      color: #38bdf8;
      font-family: monospace;
    }

    /* Variaciones de color sutiles para identificar zonas */
    .zona-tipo-a { border-left: 4px solid #ef4444; }
    .zona-tipo-b { border-left: 4px solid #10b981; }
    .zona-tipo-c { border-left: 4px solid #f59e0b; }

  </style>
</head>
<body>

  <h1>Unified Sala View — Board 20×20</h1>
  <p>Visualización real usando ecuaciones porcentuales basadas en celdas fijas de 5%</p>

  <!-- Tablero contenedor con la rejilla aplicada -->
  <div class="sala-board-container">
    
    <!-- 
      ZONA 1: "Zona Norte"
      Fórmula del diseño:
      left = posicionX * 5%  -> 2 * 5% = 10%
      top = posicionY * 5%   -> 2 * 5% = 10%
      width = columnas * 5%  -> 6 * 5% = 30%
      height = filas * 5%    -> 4 * 5% = 20%
    -->
    <div class="zona-block zona-tipo-a" 
         style="left: 10%; top: 10%; width: 30%; height: 20%;">
      <span class="zona-titulo">Zona Norte</span>
      <span class="zona-dims">[2,2] 6x4</span>
    </div>

    <!-- 
      ZONA 2: "Zona Central"
      left = 9 * 5% = 45% | top = 7 * 5% = 35%
      width = 8 * 5% = 40% | height = 6 * 5% = 30%
    -->
    <div class="zona-block zona-tipo-b" 
         style="left: 45%; top: 35%; width: 40%; height: 30%;">
      <span class="zona-titulo">Central VIP</span>
      <span class="zona-dims">[9,7] 8x6</span>
    </div>

    <!-- 
      ZONA 3: "Bloque Angular"
      left = 1 * 5% = 5% | top = 12 * 5% = 60%
      width = 5 * 5% = 25% | height = 5 * 5% = 25%
    -->
    <div class="zona-block zona-tipo-c" 
         style="left: 5%; top: 60%; width: 25%; height: 25%;">
      <span class="zona-titulo">Almacén Sur</span>
      <span class="zona-dims">[1,12] 5x5</span>
    </div>

  </div>

</body>
</html>
